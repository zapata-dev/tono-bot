steps:
  # 1. Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'northamerica-south1-docker.pkg.dev/tono-bot-tym-prod/tono-bot-images/tono-bot:$COMMIT_SHA', '.']

  # 2. Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'northamerica-south1-docker.pkg.dev/tono-bot-tym-prod/tono-bot-images/tono-bot:$COMMIT_SHA']

  # 3. Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tono-bot'
      - '--image'
      - 'northamerica-south1-docker.pkg.dev/tono-bot-tym-prod/tono-bot-images/tono-bot:$COMMIT_SHA'
      - '--region'
      - 'northamerica-south1'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'tono-bot-sa@tono-bot-tym-prod.iam.gserviceaccount.com'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--concurrency'
      - '10'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '300'
      - '--no-cpu-throttling'
      - '--add-cloudsql-instances'
      - 'tono-bot-tym-prod:northamerica-south1:tono-bot-db'
      - '--set-env-vars'
      - 'DB_HOST=/cloudsql/tono-bot-tym-prod:northamerica-south1:tono-bot-db,DB_USER=tonobot_app,DB_NAME=tonobot,DB_PORT=5432,SESSION_TTL_DAYS=45,EVOLUTION_API_URL=https://evolutionapi-evolution-api.jl4jzq.easypanel.host,EVO_INSTANCE=TractosYMaxPrueba8mil,MONDAY_STAGE_COLUMN_ID=status,MONDAY_TRACKING_ID_COLUMN_ID=text_mm196169,MONDAY_LEADS_CONNECT_ADS_COLUMN_ID=board_relation_mm19smt2,MONDAY_DEDUPE_COLUMN_ID=text_mkzw7xjz,MONDAY_VEHICLE_COLUMN_ID=dropdown_mm0gq48r,MONDAY_PAYMENT_COLUMN_ID=color_mm0gbjea,MONDAY_PHONE_COLUMN_ID=phone_mkzwh34a,MONDAY_LAST_MSG_ID_COLUMN_ID=text_mkzwndf,MONDAY_APPOINTMENT_COLUMN_ID=date_mm0grgky,MONDAY_APPOINTMENT_TIME_COLUMN_ID=hour_mm0hfk47,MONDAY_SOURCE_COLUMN_ID=color_mm0wb2gm,MONDAY_CHANNEL_COLUMN_ID=color_mm0wf5zn,MONDAY_SOURCE_TYPE_COLUMN_ID=color_mm0w1mtn,MONDAY_CTWA_CLID_COLUMN_ID=text_mm0wwwg1,MONDAY_AD_ID_COLUMN_ID=text_mm0wcdmz,MONDAY_ADS_TRACKING_COLUMN_ID=text_mm0ydya0,SUCURSALES_CSV_URL=https://docs.google.com/spreadsheets/d/e/2PACX-1vRRRZrNWaaf5YGzONzEjatkdIuuH-DKmCMiVwtx_i7-LLPBmyd_QqFgkp86V12PgYR4AdiuuQXb1MsY/pub?gid=1351905751&single=true&output=csv'
      - '--set-secrets'
      - 'DB_PASSWORD=db-password:latest,OPENAI_API_KEY=openai-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,EVOLUTION_API_KEY=evolution-api-key:latest,MONDAY_API_KEY=monday-api-key:latest,MONDAY_BOARD_ID=monday-board-id:latest,MONDAY_ADS_BOARD_ID=monday-ads-board-id:latest,OWNER_PHONE=owner-phone:latest,TEAM_NUMBERS=team-numbers:latest,SHEET_CSV_URL=sheet-csv-url:latest,CAMPAIGNS_CSV_URL=campaigns-csv-url:latest'
